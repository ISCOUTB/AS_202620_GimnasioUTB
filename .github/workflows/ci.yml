name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Pruebas unitarias y de integración
        run: npm run test:base
      - name: Prueba de contrato (docs/openapi.yaml)
        run: npm run test:contrato
