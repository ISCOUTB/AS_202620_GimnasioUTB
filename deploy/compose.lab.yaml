services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      OPERADOR_TOKEN: "${OPERADOR_TOKEN:?Define OPERADOR_TOKEN en Dokploy}"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SUPABASE_URL: "${SUPABASE_URL:?Define SUPABASE_URL en Dokploy}"
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      DATABASE_URL: "${DATABASE_URL:?Define DATABASE_URL con el rol gimnasio_runtime}"
      DATABASE_SSL: "true"
      # CA de Supabase (prod-ca-2021.crt) en base64: Node no confía en ella por defecto (ADR-0010).
      DATABASE_SSL_CA_CERT_BASE64: "${DATABASE_SSL_CA_CERT_BASE64:?Define la CA de Supabase en base64}"
    expose:
      - "${PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db-migrate:
    profiles:
      - maintenance
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: production
      DB_MIGRATIONS_ENABLED: "true"
      DB_MIGRATIONS_URL: "${DB_MIGRATIONS_URL:?Define DB_MIGRATIONS_URL con el rol gimnasio_migrator}"
      DATABASE_URL: "${DATABASE_URL:?Define DATABASE_URL con el rol gimnasio_runtime}"
      DATABASE_SSL: "true"
      DATABASE_SSL_CA_CERT_BASE64: ${DATABASE_SSL_CA_CERT_BASE64:-}
      DB_MIGRATIONS_HOST: ${DB_MIGRATIONS_HOST:-}
      DB_MIGRATIONS_TARGET: ${DB_MIGRATIONS_TARGET:-}
      DB_MIGRATIONS_PROJECT_REF: ${DB_MIGRATIONS_PROJECT_REF:-}
      SUPABASE_URL: "${SUPABASE_URL:?Define SUPABASE_URL en Dokploy}"