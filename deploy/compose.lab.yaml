services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  db-init:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["npm", "run", "db:init"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Define POSTGRES_USER en deploy/.env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB en deploy/.env}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Define POSTGRES_USER en deploy/.env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB en deploy/.env}"
    expose:
      - "${PORT:-3000}"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + process.env.PORT + '/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data: