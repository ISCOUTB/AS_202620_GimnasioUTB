openapi: 3.1.0
info:
  title: API Backend - Gimnasio UTB
  version: 4.0.0
  description: |
    Contrato HTTP del backend actual. El deployment actual utiliza Docker
    Compose en Dokploy, con PostgreSQL dentro del mismo Compose (ADR-0011). El cliente Flutter (`docs/Flutter/lib/core/api/aforo_api.dart`)
    consume estas rutas.

    **2.0.0 (S13, ADR-0007):** `POST /api/v1/aforo/acceso` exige
    `Authorization: Bearer <token de operador>`. Es un cambio incompatible y,
    por la regla de abajo, debería ir en `/api/v2`. Se hace una excepción
    documentada en ADR-0007: es una corrección de seguridad, el único
    consumidor (la app Flutter del equipo) se actualiza en el mismo cambio, y
    mantener `/api/v1` sin autenticación dejaría abierta la vulnerabilidad.
    Las lecturas (`GET`) siguen siendo públicas.

    `GET /metrics` devuelve contadores JSON en memoria por instancia; no es
    una exportación Prometheus. `GET /ready` consulta el repositorio y permite
    comprobar la disponibilidad de PostgreSQL en el servidor real.

    **3.0.0 (estabilización académica):** el inicio de sesión estudiantil
    cambió de `codigoEstudiante` a `correo` y contraseña. El cambio es incompatible: las solicitudes antiguas que solo envían
    `codigoEstudiante` reciben `400`; no existe compatibilidad retroactiva.
    Se conserva temporalmente `/api/v1` porque este contrato académico no tiene
    una versión publicada con consumidores externos que requieran coexistencia,
    y el único cliente mantenido por el equipo se actualiza junto con la API.
    No se afirma que el contrato sea compatible con clientes anteriores.

    **3.1.0 (entrega final):** se agrega `GET /` como raíz informativa
    (cambio compatible, MINOR) para que la URL del deployment no responda 404.

    **3.1.1 (ADR-0011):** solo documentación. La autenticación de estudiantes
    deja de depender de Supabase Auth: la API verifica la contraseña (scrypt)
    y emite su propio token de sesión opaco de 8 horas. Rutas, cuerpos y
    códigos de estado no cambian, por eso la app Flutter no se modifica.

    **4.0.0 (ADR-0012):** el encargado abre y cierra el gimnasio (con motivo
    opcional) y define la capacidad máxima; `GET /api/v1/aforo` entrega ese
    estado y el porcentaje de ocupación. Con el gimnasio cerrado se rechazan
    las entradas (`409 GIMNASIO_CERRADO`) y las salidas siguen permitidas. Una
    entrada que supera la capacidad responde `409 CAPACIDAD_SUPERADA` hasta que
    se repite con `confirmarExcesoCapacidad: true`. Se agregan el registro y la
    búsqueda por cédula y la verificación de la contraseña de encargado.
    Es MAJOR porque una entrada que antes siempre se registraba ahora puede
    responder 409. Igual que en 2.0.0 y 3.0.0 se conserva `/api/v1`: el único
    cliente es la app del equipo, que se actualiza en el mismo cambio.

    No hay SSO ni identidad institucional.

    Versionado (semver sobre este archivo):
    - MAJOR: cambio incompatible. En un servicio publicado requiere un nuevo
      prefijo de URL. Antes de publicar GimnasioUTB se debe fijar la estrategia
      de prefijos y migrar los clientes que deban coexistir.
    - MINOR: se agrega algo compatible (endpoint nuevo, campo opcional nuevo).
    - PATCH: solo cambia la documentación.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://gimnasio-utb.iscoutb.dev
    description: Deployment actual mediante Dokploy; HTTPS termina en su proxy/ingress.
paths:
  /:
    get:
      operationId: describirServicio
      summary: Describe el servicio y sus rutas públicas
      responses:
        '200':
          description: Información del servicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRaiz'
  /health:
    get:
      operationId: verificarSalud
      summary: Verifica que el servicio está en pie
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaHealth'
  /ready:
    get:
      operationId: verificarReadiness
      summary: Verifica que el repositorio puede responder
      responses:
        '200':
          description: El repositorio está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaHealth'
        '503':
          description: El repositorio no pudo responder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaReadinessError'
  /metrics:
    get:
      operationId: consultarMetricas
      summary: Consulta los contadores operacionales de accesos
      responses:
        '200':
          description: Contadores en memoria de esta instancia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMetricas'
  /api/v1/aforo:
    get:
      operationId: consultarAforo
      summary: Consulta el aforo, la capacidad, el estado (abierto o cerrado) y la ocupación
      responses:
        '200':
          description: Estado actual del gimnasio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEstadoAforo'
        '503':
          description: No fue posible consultar el aforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/aforo/acceso:
    post:
      operationId: registrarAcceso
      summary: Registra una entrada o salida y devuelve el aforo resultante
      security:
        - tokenOperador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAcceso'
      responses:
        '201':
          description: Acceso registrado; devuelve el nuevo aforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAforo'
        '400':
          description: Solicitud inválida, transición de dominio rechazada o JSON malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Falta la cabecera Authorization o el token de operador no es válido
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '409':
          description: Gimnasio cerrado (solo se permiten salidas) o capacidad superada sin confirmar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConflictoAcceso'
        '413':
          description: El cuerpo supera 1 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error inesperado al procesar el acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: El repositorio de aforo no está disponible, o el servidor no tiene configurado OPERADOR_TOKEN (falla cerrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/estudiantes/sesion:
    post:
      operationId: iniciarSesionEstudiante
      summary: Inicia sesión con el correo y la contraseña de una cuenta sintética de estudiante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudSesionEstudiante'
      responses:
        '200':
          description: Credenciales válidas; devuelve un token de sesión de 8 horas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesionEstudiante'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: La sesión no corresponde a un estudiante registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Identidad no disponible en este entorno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/estudiantes/qr:
    post:
      operationId: emitirQrEstudiante
      summary: Emite un QR temporal de un solo uso para el estudiante autenticado
      security:
        - sesionEstudiante: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: QR emitido con vencimiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaQr'
        '401':
          description: Sesión ausente, inválida o vencida; Flutter debe volver al login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Identidad autenticada sin perfil de estudiante asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Identidad no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/aforo/acceso-qr:
    post:
      operationId: registrarAccesoQr
      summary: Consume el QR de un estudiante y registra su entrada o salida
      security:
        - tokenOperador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr]
              additionalProperties: false
              properties:
                qr:
                  type: string
                  minLength: 1
                  maxLength: 256
                confirmarExcesoCapacidad:
                  $ref: '#/components/schemas/ConfirmarExcesoCapacidad'
      responses:
        '201':
          description: Acceso registrado y QR consumido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAccesoEstudiante'
        '400':
          description: QR inválido, vencido, ya utilizado o transición rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Token de operador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Cuenta estudiantil inactiva que intenta registrar una entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '409':
          description: Gimnasio cerrado (solo se permiten salidas) o capacidad superada sin confirmar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConflictoAcceso'
        '503':
          description: Persistencia o identidad no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/aforo/acceso-cedula:
    post:
      operationId: registrarAccesoCedula
      summary: Registra la entrada o salida de un estudiante por su cédula
      description: |
        Para quien no tiene el celular. Igual que con el QR, la API decide
        ENTRADA o SALIDA según si el estudiante estaba dentro.
      security:
        - tokenOperador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cedula]
              additionalProperties: false
              properties:
                cedula:
                  $ref: '#/components/schemas/Cedula'
                confirmarExcesoCapacidad:
                  $ref: '#/components/schemas/ConfirmarExcesoCapacidad'
      responses:
        '201':
          description: Acceso registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAccesoEstudiante'
        '400':
          description: Cédula con formato inválido o transición rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Contraseña de encargado inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: Cuenta estudiantil inactiva que intenta registrar una entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: No hay ningún estudiante con esa cédula
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '409':
          description: Gimnasio cerrado (solo se permiten salidas) o capacidad superada sin confirmar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConflictoAcceso'
        '503':
          description: Persistencia o identidad no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/aforo/estado:
    put:
      operationId: cambiarAperturaGimnasio
      summary: Abre o cierra el gimnasio, con motivo opcional al cerrar
      description: Cerrar no saca a nadie; el motivo se borra al abrir.
      security:
        - tokenOperador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abierto]
              additionalProperties: false
              properties:
                abierto:
                  type: boolean
                motivoCierre:
                  type: [string, 'null']
                  maxLength: 200
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEstadoAforo'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Contraseña de encargado inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: No fue posible guardar el cambio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/aforo/capacidad:
    put:
      operationId: cambiarCapacidadGimnasio
      summary: Define la capacidad máxima del gimnasio
      description: Puede quedar por debajo del aforo actual; nadie sale por eso.
      security:
        - tokenOperador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacidadMaxima]
              additionalProperties: false
              properties:
                capacidadMaxima:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        '200':
          description: Capacidad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEstadoAforo'
        '400':
          description: Capacidad fuera del rango 1 a 10000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Contraseña de encargado inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: No fue posible guardar el cambio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/estudiantes/busqueda:
    post:
      operationId: buscarEstudiantePorCedula
      summary: El encargado busca a un estudiante por cédula antes de registrarlo
      description: Se usa POST para que la cédula no quede en la URL ni en los registros de acceso.
      security:
        - tokenOperador: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cedula]
              additionalProperties: false
              properties:
                cedula:
                  $ref: '#/components/schemas/Cedula'
      responses:
        '200':
          description: Estudiante encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaBusquedaEstudiante'
        '400':
          description: Cédula con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: Contraseña de encargado inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: No hay ningún estudiante con esa cédula
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: Identidad no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/operador/verificacion:
    post:
      operationId: verificarEncargado
      summary: Comprueba la contraseña de encargado antes de abrir su panel en la app
      security:
        - tokenOperador: []
      responses:
        '200':
          description: Contraseña válida
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                additionalProperties: false
                properties:
                  status:
                    const: success
                  data:
                    type: object
                    required: [valido]
                    additionalProperties: false
                    properties:
                      valido:
                        const: true
        '401':
          description: Contraseña de encargado inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: El servidor no tiene configurado OPERADOR_TOKEN (falla cerrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
components:
  securitySchemes:
    tokenOperador:
      type: http
      scheme: bearer
      description: |
        Contraseña de encargado: secreto compartido del gimnasio (variable
        OPERADOR_TOKEN del servidor, mínimo 32 caracteres). Medida provisional
        hasta que existan usuarios y roles por encargado (ADR-0007).
    sesionEstudiante:
      type: http
      scheme: bearer
      description: Token de sesión opaco emitido por `POST /api/v1/estudiantes/sesion`. Dura 8 horas y la base solo guarda su hash SHA-256.
  schemas:
    SolicitudAcceso:
      type: object
      required: [tipoAcceso]
      properties:
        tipoAcceso:
          type: string
          enum: [ENTRADA, SALIDA]
        confirmarExcesoCapacidad:
          $ref: '#/components/schemas/ConfirmarExcesoCapacidad'
    ConfirmarExcesoCapacidad:
      type: boolean
      description: true cuando el encargado confirma una entrada que supera la capacidad máxima.
    Cedula:
      type: string
      pattern: '^[0-9]{5,12}$'
    EstadoGimnasio:
      type: object
      required: [aforoActual, capacidadMaxima, abierto, motivoCierre, porcentajeOcupacion]
      additionalProperties: false
      properties:
        aforoActual:
          type: integer
          minimum: 0
        capacidadMaxima:
          type: integer
          minimum: 1
          maximum: 10000
        abierto:
          type: boolean
        motivoCierre:
          type: [string, 'null']
          maxLength: 200
        porcentajeOcupacion:
          type: integer
          minimum: 0
          description: Puede pasar de 100 si el encargado confirmó ingresos por encima de la capacidad.
    RespuestaEstadoAforo:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          $ref: '#/components/schemas/EstadoGimnasio'
    RespuestaConflictoAcceso:
      type: object
      required: [status, code, message]
      additionalProperties: false
      properties:
        status:
          const: error
        code:
          type: string
          enum: [GIMNASIO_CERRADO, CAPACIDAD_SUPERADA]
        message:
          type: string
        data:
          type: object
          description: Solo con CAPACIDAD_SUPERADA.
          required: [aforoActual, capacidadMaxima]
          additionalProperties: false
          properties:
            aforoActual:
              type: integer
              minimum: 0
            capacidadMaxima:
              type: integer
              minimum: 1
    RespuestaBusquedaEstudiante:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          type: object
          required: [codigoEstudiante, nombre, activa, dentro]
          additionalProperties: false
          properties:
            codigoEstudiante:
              type: string
            nombre:
              type: string
            activa:
              type: boolean
            dentro:
              type: boolean
    RespuestaAforo:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          type: object
          required: [aforoActual]
          additionalProperties: false
          properties:
            aforoActual:
              type: integer
              minimum: 0
    RespuestaError:
      type: object
      required: [status, message]
      additionalProperties: false
      properties:
        status:
          const: error
        message:
          type: string
    RespuestaRaiz:
      type: object
      required: [status, service, descripcion, endpoints]
      additionalProperties: false
      properties:
        status:
          const: ok
        service:
          type: string
        descripcion:
          type: string
        endpoints:
          type: array
          items:
            type: string
    RespuestaHealth:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          const: ok
        service:
          type: string
    RespuestaReadinessError:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          const: error
        service:
          type: string
    RespuestaMetricas:
      type: object
      required: [access_operations_total]
      additionalProperties: false
      properties:
        access_operations_total:
          type: object
          required: [entrada, salida, total]
          additionalProperties: false
          properties:
            entrada:
              type: integer
              minimum: 0
            salida:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
    SolicitudSesionEstudiante:
      type: object
      required: [correo, contrasena]
      additionalProperties: false
      properties:
        correo:
          type: string
          format: email
          pattern: '^[a-zA-Z0-9._%+-]+@utb\.edu\.co$'
          maxLength: 254
        contrasena:
          type: string
          minLength: 1
          maxLength: 256
    RespuestaSesionEstudiante:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          type: object
          required: [token, expiresAt, estudiante]
          additionalProperties: false
          properties:
            token:
              type: string
            expiresAt:
              type: string
              format: date-time
            estudiante:
              type: object
              required: [codigoEstudiante, nombre]
              additionalProperties: false
              properties:
                codigoEstudiante:
                  type: string
                nombre:
                  type: string
    RespuestaQr:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          type: object
          required: [token, expiresAt]
          additionalProperties: false
          properties:
            token:
              type: string
            expiresAt:
              type: string
              format: date-time
    RespuestaAccesoEstudiante:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          type: object
          required: [tipoAcceso, aforoActual]
          additionalProperties: false
          properties:
            tipoAcceso:
              type: string
              enum: [ENTRADA, SALIDA]
            aforoActual:
              type: integer
              minimum: 0
            estudiante:
              type: object
              required: [codigoEstudiante, nombre]
              additionalProperties: false
              properties:
                codigoEstudiante:
                  type: string
                nombre:
                  type: string
