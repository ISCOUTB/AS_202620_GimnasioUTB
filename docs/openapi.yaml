openapi: 3.1.0
info:
  title: API Backend - Gimnasio UTB
  version: 1.0.0
  description: |
    Contrato HTTP del backend actual. El deployment actual utiliza Docker
    Compose en Dokploy. Existe un proyecto Flutter con UI, pero no se ha
    verificado su integración funcional con estas rutas.

    `GET /metrics` devuelve contadores JSON en memoria por instancia; no es
    una exportación Prometheus. `GET /ready` consulta el repositorio y permite
    comprobar la disponibilidad de PostgreSQL en el servidor real.

    Versionado (semver sobre este archivo):
    - MAJOR: cambio incompatible (renombrar/eliminar un campo, cambiar un código HTTP,
      volver obligatorio algo opcional). Implica un nuevo prefijo de URL (/api/v2).
    - MINOR: se agrega algo compatible (endpoint nuevo, campo opcional nuevo).
    - PATCH: solo cambia la documentación.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://gimnasio-utb.iscoutb.dev
    description: Deployment actual mediante Dokploy; HTTPS termina en su proxy/ingress.
paths:
  /health:
    get:
      operationId: verificarSalud
      summary: Verifica que el servicio está en pie
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaHealth'
  /ready:
    get:
      operationId: verificarReadiness
      summary: Verifica que el repositorio puede responder
      responses:
        '200':
          description: El repositorio está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaHealth'
        '503':
          description: El repositorio no pudo responder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaReadinessError'
  /metrics:
    get:
      operationId: consultarMetricas
      summary: Consulta los contadores operacionales de accesos
      responses:
        '200':
          description: Contadores en memoria de esta instancia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMetricas'
  /api/v1/aforo:
    get:
      operationId: consultarAforo
      summary: Consulta el aforo actual del gimnasio
      responses:
        '200':
          description: Aforo actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAforo'
        '503':
          description: No fue posible consultar el aforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/aforo/acceso:
    post:
      operationId: registrarAcceso
      summary: Registra una entrada o salida y devuelve el aforo resultante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAcceso'
      responses:
        '201':
          description: Acceso registrado; devuelve el nuevo aforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAforo'
        '400':
          description: Solicitud inválida, transición de dominio rechazada o JSON malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: Error inesperado al procesar el acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: El repositorio de aforo no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
components:
  schemas:
    SolicitudAcceso:
      type: object
      required: [tipoAcceso]
      properties:
        tipoAcceso:
          type: string
          enum: [ENTRADA, SALIDA]
    RespuestaAforo:
      type: object
      required: [status, data]
      additionalProperties: false
      properties:
        status:
          const: success
        data:
          type: object
          required: [aforoActual]
          additionalProperties: false
          properties:
            aforoActual:
              type: integer
              minimum: 0
    RespuestaError:
      type: object
      required: [status, message]
      additionalProperties: false
      properties:
        status:
          const: error
        message:
          type: string
    RespuestaHealth:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          const: ok
        service:
          type: string
    RespuestaReadinessError:
      type: object
      required: [status, service]
      additionalProperties: false
      properties:
        status:
          const: error
        service:
          type: string
    RespuestaMetricas:
      type: object
      required: [access_operations_total]
      additionalProperties: false
      properties:
        access_operations_total:
          type: object
          required: [entrada, salida, total]
          additionalProperties: false
          properties:
            entrada:
              type: integer
              minimum: 0
            salida:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
